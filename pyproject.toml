[project]
name = "quotation-agent"
version = "0.1.0"
description = "Local agentic quotation workflow"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.128.8",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.5",
    "pydantic-ai>=0.8.1",
    "pydantic-ai-slim[anthropic,google,groq,openai]>=0.8.1",
    "python-dotenv>=1.2.1",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
]

[project.scripts]
email-detect = "email_detection_layer.detector:main"
email-ingest = "email_detection_layer.pipeline:main"

[tool.pytest.ini_options]
markers = [
    "integration: tests multiple application layers together",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["email_detection_layer", "agent_system", "job_queue", "mock_data"]
