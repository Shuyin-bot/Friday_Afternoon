[project]
name = "quotation-agent"
version = "0.1.0"
description = "Local agentic quotation workflow"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.13.5",
    "pydantic-ai>=0.8.1",
    "python-dotenv>=1.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
]

[project.scripts]
email-detect = "email_detection_layer.detector:main"

[tool.pytest.ini_options]
markers = [
    "integration: tests multiple application layers together",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["email_detection_layer", "agent_system", "job_queue"]
